<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auaufood | Contato</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

</head>
<body>

<header>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="img/logo2.png" alt="Logo Auaufood">
        <span>Auaufood</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Sobre nós</a></li>
          <li class="nav-item"><a class="nav-link" href="cardapio.html">Cardápio</a></li>
          <li class="nav-item"><a class="nav-link active" href="contato.html">Contato</a></li>
        </ul>
        <a class="btn btn-cart ms-lg-3" href="cardapio.html">🛒 Carrinho (<span class="quantidade">0</span>)</a>
      </div>
    </div>
  </nav>
</header>

<main>
  <section class="contact-hero">
    <div class="container">
      <div class="row align-items-center g-4">
        <div class="col-lg-5 text-center text-lg-start">
          <span class="eyebrow">ESTAMOS POR AQUI 🐾</span>
          <h1>Fale com <span>a gente!</span></h1>
          <p>Dúvidas, sugestões ou reclamações? Mande uma mensagem. Nossa equipe está pronta para ouvir você!</p>
          <img src="img/logo2.png" alt="Mascote Auaufood" class="contact-logo">
        </div>

        <div class="col-lg-7">
          <div class="contact-box">
            <h2>Envie sua mensagem</h2>
            <form id="formContato">
              <div class="mb-3">
                <label for="nome" class="form-label">Seu nome</label>
                <input type="text" id="nome" class="form-control" placeholder="Digite seu nome" required>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">Seu e-mail</label>
                <input type="email" id="email" class="form-control" placeholder="Digite seu e-mail" required>
              </div>

              <div class="mb-3">
                <label for="mensagem" class="form-label">Mensagem</label>
                <textarea id="mensagem" class="form-control" rows="5" placeholder="Escreva sua mensagem..." required></textarea>
              </div>

              <button type="submit" class="btn btn-main w-100">Enviar mensagem →</button>
            </form>
            <div id="respostaContato"></div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
